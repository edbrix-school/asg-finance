spring.application.name=asg-finance

# --- SERVER CONFIG ---
server.port=8086
server.servlet.context-path = /finance/api

# --- DATASOURCE CONFIG ---
spring.datasource.url=jdbc:oracle:thin:@//10.100.200.85:1521/ORAVADF
spring.datasource.username=PRODUCTION
spring.datasource.password=PRODUCTION_19C#
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- JPA DIALECT ---
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- DEFAULT SCHEMA ---
spring.jpa.properties.hibernate.default_schema=PRODUCTION

# Common Hikari settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-ASG
# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=5000
# Leak detection
spring.datasource.hikari.leak-detection-threshold=60000
# Keep connections alive
spring.datasource.hikari.keepalive-time=300000

# --- JPA CONFIG ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Transaction timeout (in seconds) - prevents long-running transactions
spring.transaction.default-timeout=30
# JPA properties
# spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Let Spring's transaction manager handle auto-commit (removed conflicting Hibernate property)

# --- LOGGING ---
# Basic log levels
logging.level.root=INFO
logging.level.com.asg=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Log file
logging.file.name=logs/app.log

# Console format
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# --- FILE UPLOAD LIMIT (optional tweak) ---
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Pagination defaults
pagination.page-number=0
pagination.page-size=10
pagination.sort-by=id
pagination.sort-dir=asc

# Attachments configuration
#attachments.base-path=C:\\temp\\attachments\\
# For Windows local dev
attachments.base-path=C:\opt\app\attachments\
attachments.allowed-extensions=pdf,txt,csv,jpg,jpeg,png,bmp,gif,doc,docx,xls,xlsx

# Regex for valid Document Id format
docid.api.validDocIdFormatRegexp=\\d{3,4}-\\d{3,4}

# Bank file directory parameter name
bank.file.directory.parameter.name=AUB_FTP_FILE_LOAD
bank.file.pp.directory=FAX_EMAIL

# HSBC API Configuration
hsbc.payment.process.interval=300000
hsbc.payment.status.interval=600000

# Microservices URLs
common-services.url=http://localhost:8083/common-services/api/
settings.service.url=http://localhost:8084/settings/api/

spring.jackson.serialization.write-dates-as-timestamps=false